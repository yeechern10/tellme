[project]
name = "tellme"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "bs4>=0.0.2",
    "cloudscraper>=1.2.71",
    "dotenv>=0.9.9",
    "fastapi>=0.143.0",
    "gradio>=6.30.0",
    "huggingface-hub>=0.33.4,<2.0.0",
    "langchain>=1.4.7",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "openai>=3.26.1",
    "playwright>=1.64.0",
    "prometheus-client>=0.26.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "selenium>=4.51.0",
    "sentence-transformers>=6.2.0",
    "trafilatura>=2.3.1",
    "transformers>=5.19.0",
]

[dependency-groups]
dev = [
    "gradio>=6.30.0",
    "ipykernel>=7.4.0",
]

[project.scripts]
init-keywords = "app.db.init_keywords_table:main"
tellme = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["logs*", "db*", "tests*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true